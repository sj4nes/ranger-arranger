permissions:
  contents: write
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.1
          ./actionlint -color

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run stable fuzz harness
        run: cargo test --test fuzz_harness

  release:
    name: Bump version and tag
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure git identity
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Bump version
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh "${{ github.event.inputs.bump || 'patch' }}"
          NEXT=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Push changes
        run: git push origin HEAD

  package:
    name: Package extension
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
          fetch-tags: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Push changes
        run: git push origin HEAD

      - name: Install cargo-vsql
        run: cargo install --path vendor/vsql-rust-sdk/cargo-vsql

      - name: Build extension package
        id: veb
        run: |
          cargo vsql install
          VEB=$(find "$HOME/.villagesql/veb_output_directory" -name '*.veb' -print -quit)
          ARCHIVE="$HOME/.villagesql/veb_output_directory/vsql-ranger-arranger-${{ needs.release.outputs.version }}-x86_64.veb"
          cp "$VEB" "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsql-ranger-arranger-x86_64
          path: ${{ steps.veb.outputs.path }}
          retention-days: 90

      - name: Build arm64 Linux package
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu -p vsql_ranger_arranger
          LIB=$(find target/aarch64-unknown-linux-gnu/release -name 'libvsql_ranger_arranger*.so' -print -quit)
          mkdir -p arm64/lib
          cp "$LIB" arm64/lib/
          cp manifest.json arm64/
          tar -czf "$HOME/.villagesql/veb_output_directory/vsql-ranger-arranger-${{ needs.release.outputs.version }}-aarch64.veb" -C arm64 .
          echo "arm64_path=$HOME/.villagesql/veb_output_directory/vsql-ranger-arranger-${{ needs.release.outputs.version }}-aarch64.veb" >> "$GITHUB_OUTPUT"
        id: veb-arm64

      - name: Upload arm64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsql-ranger-arranger-aarch64
          path: ${{ steps.veb-arm64.outputs.arm64_path }}
          retention-days: 90

  github-release:
    name: Create GitHub Release
    needs: [release, package]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release notes
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## $VERSION

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ### Artifacts
          - \`vsql-ranger-arranger-${VERSION}-x86_64.veb\` (Linux x86_64)
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            artifacts/**/*.veb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run stable fuzz harness
        run: cargo test --test fuzz_harness

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated

      - name: Audit dependencies for security advisories
        run: |
          cargo install cargo-audit
          cargo audit --deny unmaintained --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0253 # paste is unmaintained but only used transitively via the vendored vsql-rust-sdk; lru is blocked by mysql crate's lru = ^0.16.3 dependency, both tracked separately

  release:
    name: Create release via cargo-release
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Configure git identity
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Release with cargo-release
        id: release
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          # Dry-run first to capture the computed version/tag
          OUTPUT=$(cargo release $BUMP --no-confirm --no-publish 2>&1 || true)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oE ' releasing [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}')
          TAG="v$VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to determine release version from cargo-release dry-run"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Execute the release: bumps Cargo.toml, updates changelog, commits, tags, pushes
          cargo release $BUMP --no-confirm --no-publish --execute

  package:
    name: Package extension
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm64
            arch: arm64
    outputs:
      veb_path: ${{ steps.veb.outputs.path }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build extension package
        id: veb
        run: |
          cargo vsql install
          VEB=$(ls target/veb_output_directory/*.veb | head -n 1)
          ARCHIVE="target/veb_output_directory/vsql-ranger-arranger-${{ needs.release.outputs.version }}-${{ matrix.arch }}.veb"
          cp "$VEB" "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsql-ranger-arranger-${{ matrix.arch }}
          path: ${{ steps.veb.outputs.path }}
          retention-days: 90

  github-release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release notes
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## $VERSION

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ### Artifacts
          - \`vsql-ranger-arranger-${VERSION}-x86_64.veb\` (Linux x86_64)
          - \`vsql-ranger-arranger-${VERSION}-arm64.veb\` (Linux arm64)
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            artifacts/**/*.veb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

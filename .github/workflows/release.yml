permissions:
  contents: write
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.1
          ./actionlint -color

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run stable fuzz harness
        run: cargo test --test fuzz_harness

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated

      - name: Audit dependencies for security advisories
        run: |
          cargo install cargo-audit
          cargo audit --deny unmaintained --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0253 # paste is unmaintained but only used transitively via the vendored vsql-rust-sdk; lru is blocked by mysql crate's lru = ^0.16.3 dependency, both tracked separately

  release:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure git identity
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Bump version
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh "${{ github.event.inputs.bump || 'patch' }}"
          NEXT=$(grep -m 1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Push changes
        run: git push origin HEAD

  package:
    name: Package extension
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Push changes
        run: git push origin HEAD

      - name: Build extension package
        id: veb
        run: |
          cargo vsql install
          VEB=$(find target/veb_output_directory -name '*.veb' -print -quit)
          ARCHIVE="target/veb_output_directory/vsql-ranger-arranger-${{ needs.release.outputs.version }}-x86_64.veb"
          cp "$VEB" "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsql-ranger-arranger-x86_64
          path: ${{ steps.veb.outputs.path }}
          retention-days: 90

  github-release:
    name: Create GitHub Release
    needs: [release, package]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release notes
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## $VERSION

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ### Artifacts
          - \`vsql-ranger-arranger-${VERSION}-x86_64.veb\` (Linux x86_64)
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            artifacts/**/*.veb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Skip CI if the only changed file is CHANGELOG.md
  changelog_skip:
    name: Skip if CHANGELOG is only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths-filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dorny/paths-filter@v3
        id: paths-filter
        with:
          filters: |
            code:
              - '!CHANGELOG.md'

  build:
    name: Build and test
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.1
          ./actionlint -color

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage baseline
        run: cargo llvm-cov --lib --tests --all-features --ignore-filename-regex 'vendor/|villagesql/' --fail-under-lines 50 --lcov --output-path lcov.info

      - name: Generate HTML coverage report
        run: cargo llvm-cov --lib --tests --all-features --ignore-filename-regex 'vendor/|villagesql/' --html --output-dir target/llvm-cov/html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/

      - name: Run tests
        run: cargo test --all-targets --all-features
